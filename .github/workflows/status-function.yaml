name: status-function

on: workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        run: exit 1
  job2:
    needs: job1
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repository
        run: echo "job1 is successful!"
  job3:
    needs: job1
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout repository
        run: echo "job1 has failed!"
  job4:
    needs: job1
    runs-on: ubuntu-latest
    if: cancelled()
    steps:
      - name: Checkout repository
        run: echo "job1 has been cancelled!" 
  job5:
    needs: job1
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        run: echo "job1 has completed!"
  job6:
    needs: job1
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        run: echo "send mail to oncall engineer!" 
  job7:
    needs: job1
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        run: echo "send mail to oncall engineer!"    
